name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -c requirements.lock '.[test,browser,firmware]'
      - run: playwright install --with-deps chromium
      - run: ruff check tempmonitor tests scripts
      - run: pytest -q
      - run: python scripts/check_firmware.py
      - run: python scripts/check_firmware.py --external --compile
      - run: docker compose config --quiet
