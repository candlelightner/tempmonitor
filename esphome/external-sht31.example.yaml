# Adafruit SHT31-D STEMMA QT in the lower compartment (air inlet), 3.3 V I2C.
esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: id(external_required) = true;
sensor:
  - platform: sht3xd
    i2c_id: sensor_bus
    address: 0x44
    update_interval: 5s
    temperature:
      name: External Temperature
      on_value:
        - lambda: |-
            id(external_value) = x;
            id(external_seen) = true;
            id(external_received) = millis();
        - script.execute: apply_control
    humidity:
      name: External Humidity
