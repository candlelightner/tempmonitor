[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tempmonitor"
version = "0.1.0"
description = "Local GPU and environmental monitoring with autonomous ESPHome fan control"
requires-python = ">=3.12"
dependencies = [
  "nicegui>=3.18,<4", "pydantic>=2.10,<3", "argon2-cffi>=25,<26",
  "aioesphomeapi>=46.12,<47", "nvidia-ml-py>=13,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]
browser = ["playwright==1.64.1"]
firmware = ["esphome==2026.10.0"]

[project.scripts]
tempmonitor = "tempmonitor.web:main"

[tool.setuptools.packages.find]
include = ["tempmonitor*"]

[tool.setuptools.package-data]
tempmonitor = ["*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: Chromium end-to-end tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
